name = "antigravity"
main = "worker.js"
compatibility_date = "2026-01-22"

# PROMOTED after canary verification on 2026-08-13.
# Canary antigravity-canary (version 748ac647) verified from the Beget VPS:
#   - /trace: cf-placement response header "remote-IAD" (executed in Ashburn,
#     not the ARN eyeball colo)
#   - 10/10 streamGenerateContent via canary on daily: all 200, zero 400
#   - full game turn via canary: source=live provider=arem (161 words)
# Deploying the same verified script under the production name keeps the
# workers.dev URL unchanged and Levitate's endpoint intact.
#
# Explicit region placement moves the Worker next to a Google Cloud region
# (US), so Google sees non-RU egress and the daily 200/400 location flap
# disappears. Do NOT use placement.hostname here: host probing is
# experimental and unreliable against replicated/anycast endpoints like
# googleapis.com.
[placement]
region = "gcp:us-east4"
