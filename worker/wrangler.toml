name = "antigravity"
main = "worker.js"
compatibility_date = "2026-01-22"

# Deploys over the EXISTING production worker, so the workers.dev URL stays
# https://antigravity.<account>.workers.dev and Levitate's env needs no change.
# If `wrangler deploy` says the name is taken by another account, do NOT pick
# a new name silently — that changes the subdomain and Levitate's endpoint.

# CANDIDATE — NOT VERIFIED IN PRODUCTION.
# Worker called from ARN/RU runs in the ARN colo and Google daily-cloudcode-pa
# answers intermittent 400 "User location is not supported". Levitate's
# geo-retry on the same daily host currently absorbs that flap (live turn
# verified 200 via Arem without any local machine process).
#
# Explicit region placement moves the Worker next to a Google Cloud region
# (US), so Google sees non-RU egress. Do NOT use placement.hostname here:
# host probing is experimental and unreliable against replicated/anycast
# endpoints like googleapis.com.
#
# After `npx wrangler deploy`, verify:
#   1. curl -sS -D- https://antigravity.<account>.workers.dev/trace
#      — /trace returns eyeball request.cf.*; the cf-placement response
#      header shows where the Worker actually executed and must not be
#      "local"/ARN. /cdn-cgi/* is rejected 404, not a placement check.
#   2. Repeated streamGenerateContent (10x) — no 400 location.
#   3. One full game turn — source=live provider=arem.
# Only then update docs to claim the fix works. If 400s persist, remove
# this block and fall back to geo-retries / a dedicated western proxy.
[placement]
region = "gcp:us-east4"
